aid: shoobs
name: Shoobs
description: >-
  Shoobs is a UK-based online events discovery and ticketing platform focused on
  urban culture — Afrobeats, R&B, hip-hop, dancehall, comedy, theatre, festivals,
  brunches and club nights across London and other British cities. Founded as a
  Y Combinator-backed startup, Shoobs helps fans find and book tickets to events
  that match their taste, and lets promoters list and sell tickets for urban and
  Black-British cultural events. The platform pairs an events listing and
  discovery site with an integrated editorial blog covering artists, concerts and
  nightlife. Shoobs is a consumer web product; it does not publish a public
  developer API, SDKs, or API documentation.
